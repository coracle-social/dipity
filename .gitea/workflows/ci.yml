name: CI

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm exec just check

      - name: Lint
        run: pnpm exec just lint

      - name: Check formatting
        run: pnpm exec just format

      - name: Check comments
        run: pnpm exec just comments

      - name: Check the Xcode project
        run: pnpm exec just xcode

  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check formatting
        run: pnpm exec just core-fmt

      - name: Lint
        run: pnpm exec just core-lint

      - name: Test
        run: pnpm exec just core-test
