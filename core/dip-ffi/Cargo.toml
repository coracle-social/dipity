[package]
name = "dip-ffi"
description = "uniffi bindings — the core's only surface to Swift and Kotlin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "dip_ffi"
# lib for tests and the bindgen bin, cdylib for Android, staticlib for iOS.
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow.workspace = true
# Nostr keys, so the bytes the shell hands over become the type the core signs
# with rather than staying a byte array.
coracle-lib.workspace = true
dip.workspace = true
# Hex is the one door into a coracle-lib SecretKey, so the bytes the shell reads
# out of secure storage go through it. See src/keys.rs.
hex.workspace = true
# The facade this crate installs a shell-backed logger behind; see src/logging.rs.
# `std` is what carries `set_boxed_logger`, and is off by default.
log = { workspace = true, features = ["std"] }
# The view builds an event and hands it over as NIP-01 JSON; see src/node.rs.
serde.workspace = true
serde_json.workspace = true
# The store announces its writes on broadcast channels, which src/store.rs
# drains for the view. Sync only: no runtime, no reactor.
tokio.workspace = true
uniffi = { workspace = true, features = ["cli"] }
# Wiping the copies this crate makes of what the shell handed over.
zeroize.workspace = true

[lints]
workspace = true
