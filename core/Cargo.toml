[workspace]
resolver = "3"
members = ["dip", "dip-ffi"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
dip = { path = "dip" }
uniffi = "0.32"

# Nostr types and stateless utilities: events, keys, tags, filters, kinds,
# addresses, NIP-77 negentropy. See ../docs/overview.md.
#
# Published crates, so this builds anywhere. Iterating on the library alongside
# the app is the `[patch.crates-io]` block at the bottom of this file.
coracle-lib = "0.1"
# A reader and a writer per kind, over the vocabulary in `coracle_lib`'s
# `readers` and `writers`.
coracle-kinds = "0.1"
hex = "0.4"
# Wiping a buffer that held key material, where the type holding it does not
# already do that on drop.
zeroize = "1"

# Signing and signature verification, on the audited binding — pinned to the
# version `coracle-lib` wraps so one libsecp256k1 is linked, not two.
secp256k1 = { version = "0.29", features = ["global-context"] }
# The authorship proof's explicit scalars and points, which the secp256k1
# binding deliberately does not expose. Nothing here signs or verifies a
# signature; that stays above. See docs/proofs.md#implementation.
k256 = { version = "0.13", default-features = false, features = [
  "arithmetic",
  "precomputed-tables",
  "std",
] }
sha2 = "0.10"
# BLAKE3 verified streaming: the outboard trees a device proves a range of a
# blob with, and the slices a fetcher checks against the root alone.
# See docs/sync.md#blob-sync and docs/nips/imeta-blake3.md.
bao = "0.13"
# HMAC-SHA256 for the recognition tags; see docs/discovery.md#recognition.
hmac = "0.12"
# Auxiliary randomness for the proof nonce, and nothing else. The derivation is
# safe without it — see docs/proofs.md#nonce-derivation.
getrandom = "0.2"
# Wire encoding for bodies inside a NIP-01 JSON array, which can hold binary.
base64 = "0.22"
# The logging facade only. Inert until a shell installs a logger; `dip-ffi`s
# `logging` module is the hook it does that through, and the shell is what
# routes a record to os_log or logcat. Nothing in the core picks one.
log = "0.4"

# The store. Bundled amalgamation so both platforms run one pinned SQLite
# rather than whatever the OS shipped — see docs/storage.md.
rusqlite = { version = "0.39", features = ["bundled"] }
# Broadcast channels for reactive reads. `sync` only: no runtime, no reactor.
tokio = { version = "1", features = ["sync"] }
# Noise XX, over the audited pure-Rust implementation. See docs/transport.md.
snow = "0.10"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Point the two library crates back at a local checkout, for working on the app
# and the library at once. Upstream tangles `src/` from `book/`, so a checkout
# has nothing to build against until `just tangle` runs there.
#
# [patch.crates-io]
# coracle-lib = { path = "../../coracle-rust/coracle-lib" }
# coracle-kinds = { path = "../../coracle-rust/coracle-kinds" }
